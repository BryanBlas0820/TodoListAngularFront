<div class="content">
  <div class="login-container">
    <div class="form-container">

      <h2>Iniciar Sesión</h2>

      <div>
        <input type="email" [formControl]="frmCorreo" placeholder="Correo">
        <input type="password" [formControl]="frmPassword" placeholder="Contraseña">

        <button (click)="fnLogin()">Ingresar</button>
        <button type="button">Registrar</button>
      </div>

    </div>
  </div>
</div>
